{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client Membership</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-primary { background-color: #007bff; }
        .btn-success { background-color: #28a745; }
        .btn-danger { background-color: #dc3545; }
        .badge { padding: 5px 10px; border-radius: 12px; font-size: 0.85em; color: white; }
        .badge-active { background-color: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Membership</h1>
        <div>
            <h3>Current Plan: Premium Access</h3>
            <p><strong>Validity:</strong> Jan 1, 2026 - Dec 31, 2026 <span class="badge badge-active">Active</span></p>
            <p><strong>Benefits:</strong> Gym access, Pool, Group Classes</p>
            <button class="btn btn-primary">Renew Membership</button>
        </div>
        <hr>
        <h3>Payment History</h3>
        <table>
            <tr><th>Date</th><th>Amount</th><th>Status</th></tr>
            <tr><td>2026-01-01</td><td>$120.00</td><td>Paid</td></tr>
        </table>
    </div>
</body>
</html>
