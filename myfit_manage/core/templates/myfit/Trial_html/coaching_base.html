
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MyFit{% endblock %}</title>

<style>
/* MyFit Mauritius black and yellow theme */
:root {
    --bg: #121416;
    --panel: #202428;
    --yellow: #ffc324;
    --text: #f8f8f7;
    --muted: #aeb5bc;
    --border: #393d41;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    line-height: 1.5;
}

header {
    padding: 20px 6%;
    background: #1a1d20;
    border-bottom: 2px solid var(--yellow);
}

.logo {
    font-size: 26px;
    font-weight: 900;
    color: var(--yellow);
    text-decoration: none;
}

nav {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 12px;
}

a { color: var(--yellow); }

main {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
}

h1, h2 { color: var(--yellow); }

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    margin: 20px 0;
}

input, select, textarea {
    display: block;
    width: 100%;
    max-width: 450px;
    padding: 11px;
    margin: 6px 0 15px;
    background: #111;
    color: white;
    border: 1px solid #555;
    border-radius: 6px;
}

button, .button {
    display: inline-block;
    padding: 11px 16px;
    background: var(--yellow);
    color: #111;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
    margin: 4px 5px 4px 0;
}

button:hover, .button:hover {
    filter: brightness(1.1);
}

.danger {
    background: #b83b3b;
    color: white;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #444;
}

th { color: var(--yellow); }

.table-wrap { overflow-x: auto; }

.message {
    padding: 12px;
    background: #304936;
    border-radius: 6px;
}

.errorlist { color: #ff9999; }

.muted { color: var(--muted); }

@media(max-width:650px) {
    .panel { padding: 15px; }
    h1 { font-size: 27px; }
}
</style>
</head>

<body>

<header>
    <a class="logo" href="{% url 'myfit:home' %}">
        MYFIT MAURITIUS
    </a>

    <nav>
        <a href="{% url 'myfit:home' %}">Home</a>
        <a href="{% url 'myfit:coaching_trial' %}">
            Fitness Tracking
        </a>
    </nav>
</header>

<main>
    <!-- Django success and error messages -->
    {% if messages %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <!-- Content from child templates appears here -->
    {% block content %}{% endblock %}
</main>

</body>
</html>
