
{% extends 'myfit/Trial_html/coaching_base.html' %}

{% block title %}Edit Workout{% endblock %}

{% block content %}

<h1>Edit Workout</h1>

<div class="panel">

    <!-- Form contains the current workout values -->
    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>

        <a class="button"
           href="{% url 'myfit:coaching_workouts' %}">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
