{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Plans</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-primary { background-color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Manage Membership Plans</h1>
        <button class="btn btn-primary" style="margin-bottom: 15px;">+ Add New Plan</button>
        <table>
            <tr><th>Plan Name</th><th>Price</th><th>Benefits</th><th>Controls</th></tr>
            <tr>
                <td>Premium Access</td>
                <td>$120/yr</td>
                <td>Gym, Pool, Classes</td>
                <td><button class="btn btn-primary">Edit</button></td>
            </tr>
            <tr>
                <td>Standard Access</td>
                <td>$60/yr</td>
                <td>Gym only</td>
                <td><button class="btn btn-primary">Edit</button></td>
            </tr>
        </table>
    </div>
</body>
</html>
