
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Membership Plan - MyFit</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }

        .btn-primary {
            background-color: #007bff;
        }

        .errorlist {
            color: #b00020;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- START TASK 2 - EDIT MEMBERSHIP PLAN -->

        <h1>Edit Membership Plan: {{ plan.name }}</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>
        </form>

        <p>
            <a href="{% url 'myfit:manage_plans' %}">
                Back to Membership Plans
            </a>
        </p>

        <!-- END TASK 2 - EDIT MEMBERSHIP PLAN -->

    </div>
</body>
</html>
