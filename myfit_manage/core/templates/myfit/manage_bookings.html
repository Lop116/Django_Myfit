{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Bookings</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-danger { background-color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Manage Bookings</h1>
        <div style="margin-bottom: 15px;">
            <input type="text" placeholder="Filter bookings..." style="padding: 8px; width: 300px;">
        </div>
        <table>
            <tr><th>Booking ID</th><th>Class/Session</th><th>Date</th><th>Status</th><th>Controls</th></tr>
            <tr>
                <td>#B001</td>
                <td>Yoga Class</td>
                <td>2026-10-20</td>
                <td>Confirmed</td>
                <td><button class="btn btn-danger">Cancel</button></td>
            </tr>
        </table>
    </div>
</body>
</html>
