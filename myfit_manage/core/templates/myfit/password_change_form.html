{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password | MyFit</title>
  <link rel="stylesheet" href="{% static 'css/admin_dashboard.css' %}">
</head>
<body>
<main class="main">
  <header class="topbar">
    <div><p class="eyebrow">MyFit / Account security</p><h1 class="page-title">Change password<em>.</em></h1></div>
  </header>
  <section class="panel">
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div class="form-grid">
        {% for field in form %}
        <div class="form-field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>
        {% endfor %}
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Update password</button>
        <a class="btn" href="{% url 'myfit:home' %}">Cancel</a>
      </div>
    </form>
  </section>
</main>
</body>
</html>
