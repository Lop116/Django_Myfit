<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFit | Create Support Ticket</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #101010;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        header {
            padding: 22px 7%;
            border-bottom: 1px solid #303030;
        }
        .logo { font-size: 25px; font-weight: bold; }
        .logo span, label { color: #facc15; }
        a { color: #facc15; text-decoration: none; }
        main { max-width: 700px; margin: 45px auto; padding: 0 22px; }
        .panel {
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 26px;
        }
        label { display: block; margin: 18px 0 8px; font-weight: bold; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #444;
            background: #111;
            color: white;
            font: inherit;
        }
        textarea { min-height: 170px; resize: vertical; }
        button {
            margin-top: 22px;
            padding: 12px 18px;
            border: 0;
            border-radius: 7px;
            background: #facc15;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }
        .error {
            background: #3b2020;
            padding: 12px;
            border-radius: 7px;
        }
    </style>
</head>
<body>
<header>
    <div class="logo">myfit<span>.</span></div>
</header>

<main>
    <p><a href="{% url 'myfit:support_ticket_list' %}">← Back to support</a></p>
    <h1>Create a support ticket</h1>
    <p>Describe the issue and our support team can follow up with you.</p>

    {% for message in messages %}
        <p class="error">{{ message }}</p>
    {% endfor %}

    <section class="panel">
        <form method="post">
            {% csrf_token %}

            <label for="subject">Subject</label>
            <input id="subject" name="subject" maxlength="200"
                   value="{{ request.POST.subject|default:'' }}" required>

            <label for="description">Description</label>
            <textarea id="description" name="description"
                      required>{{ request.POST.description|default:'' }}</textarea>

            <button type="submit">Submit ticket</button>
        </form>
    </section>
</main>
</body>
</html>
